############################
# HTTPS SERVER (PORT 443)
############################
server {
    listen 443 ssl http2;
    server_name ciphera.xyz www.ciphera.xyz;

    # Hide nginx version and server header completely
    server_tokens off;
#    more_clear_headers Server;

    ############################
    # SSL (Managed by Certbot)
    ############################
    ssl_certificate /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

    ############################
    # SECURITY HEADERS
    ############################
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP (strict - production build) - MUST be single line for HTTP/2
    # Removed unsafe-inline/unsafe-eval for XSS protection, kept 'unsafe-inline' for styles only (Vite injects dynamic styles)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss: ws:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:;" always;

    # HSTS (ENABLE only when HTTPS confirmed stable)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    ############################
    # GZIP
    ############################
    gzip on;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    ############################
    # UPLOAD LIMIT
    ############################
    client_max_body_size 100M;

    ############################
    # CERTBOT CHALLENGE
    ############################
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    ############################
    # BLOCK SENSITIVE FILES
    ############################
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|sh|sql|bak|config|swp|htaccess|ini|php)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    ############################
    # FRONTEND (REACT)
    ############################
        # Security: Block access to sensitive files and directories
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }
    
    # Security: Block access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Allow challenge download API paths explicitly (must come before deny regex below)
    location ~ "^/api/challenges/[a-f0-9]{24}/download/" {
        proxy_pass http://localhost:10000;
        proxy_http_version 1.1;

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep downloads stable
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }



    
    # Security: Block common backup/archive file patterns (prevents Nikto false positives)
    location ~ \.(tar|tar\.gz|tar\.bz2|tar\.lzma|tgz|zip|bak|old|backup|sql|dump|war|jar|egg|jks|cer|pem|key)$ {    
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }
    
    
    
    location / {
        root /home/sandy/ctf-server1/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    ############################
    # BACKEND API - FILE UPLOADS & DOWNLOADS (needs longer timeout)
    ############################
    location ~ "^/api/challenges/[a-f0-9]{24}/(files|download/)" {
        proxy_pass http://localhost:10000;
        proxy_http_version 1.1;

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for large file uploads/downloads
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Required for file uploads
        proxy_request_buffering off;
    }

    ############################
    # BACKEND API - REGULAR ROUTES
    ############################
    location /api/ {
        proxy_pass http://localhost:10000;
        proxy_http_version 1.1;

        # WebSocket / SSE support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Normal timeouts (security-conscious)
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 45s;

        # Disable buffering for real-time events
        proxy_buffering off;
    }

}

############################
# HTTP → HTTPS REDIRECT
############################
server {
    if ($host = ciphera.ddns.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name ciphera.xyz www.ciphera.xyz; 

    # Hide nginx version on HTTP redirect
    server_tokens off;

    return 301 https://ciphera.xyz$request_uri;


}
